arguments:
  source: [] # Populated via CAMERA_SOURCES env var
  camera_ids:
    - "1"
    - "2"
    - "3"
    - "5"
    - "6"
    - "7"
  config: config/config_infer_primary_yolo11.txt
  pose_config: config/config_infer_primary_yolo11_pose.txt
  output: out_yolo11_pose.mp4
  width: 1920
  height: 1080
  gpu: 0
  enable_csv: false
  enable_db: true

constants:
  tracker_config: config_tracker_NvByteTrack.yml
  tracker_lib: /opt/nvidia/deepstream/deepstream-8.0/lib/libnvds_nvmultiobjecttracker.so
  streammux_batch_size: 1
  num_keypoints: 17
  fps_interval_sec: 10      # Interval in seconds to calculate deepstream FPS
  infer_stride: 3           # Process every 3rd frame for 30 FPS source -> 10 FPS inference
  max_recording_minutes: 5
  max_no_det_frames: 100    # Stop recording after 100 frames with no detections
  mexico_tz_offset: -6
  csv_path: metadata.csv
